<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blok Ustası QR</title><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { --ink: #182445; --soft: rgba(24, 36, 69, .6); --green: #36b052; --green-d: #1f7a33; --blue: #2a77e0; --line: #dfe7f5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: linear-gradient(#7cc6ff, #3d8fe0); color: var(--ink); font: 600 18px/1.4 'Nunito', 'Segoe UI', system-ui, sans-serif; }
main { width: 100%; max-width: 440px; padding: 28px 30px; border-radius: 28px; background: #fff; text-align: center;
  box-shadow: 0 10px 0 #b9c5dc, 0 18px 40px rgba(10, 20, 50, .3); }
main.wide { max-width: 760px; }
h1 { margin: 6px 0 0; font: 800 40px/1.1 'Trebuchet MS', system-ui, sans-serif; }
.ver { margin: 2px 0 20px; color: var(--soft); }
.icon { width: 128px; height: 128px; border-radius: 28px; }
.btns { display: flex; flex-direction: column; gap: 16px; }
.go { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px; border-radius: 22px;
  background: var(--green); color: #fff; text-decoration: none; box-shadow: 0 7px 0 var(--green-d);
  font: 800 34px/1 'Trebuchet MS', system-ui, sans-serif; }
.go.alt { background: #fff; color: var(--blue); box-shadow: 0 7px 0 var(--line), inset 0 0 0 3px var(--line); font-size: 28px; padding: 14px; }
.go:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--green-d); }
.hint { margin: 18px 0 0; color: var(--soft); font-size: 16px; }
.hint svg { width: 18px; height: 18px; vertical-align: -3px; }
.head { display: flex; align-items: center; justify-content: center; gap: 14px; text-align: left; }
.head .icon { width: 64px; height: 64px; border-radius: 16px; }
.head h1 { font-size: 32px; margin: 0; }
.head .ver { margin: 0; }
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin: 10px 0 14px; }
.card { flex: 1 1 260px; max-width: 360px; }
.card svg { display: block; width: min(320px, 72vw, 52vh); height: auto; margin: 0 auto; }
.cards.many .card svg { width: min(240px, 72vw, 40vh); }
.url { margin: 4px 0 0; font: 700 17px ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
.net { margin: 0; color: var(--soft); font-size: 15px; }
.net b { color: var(--ink); }
.steps { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0; padding: 0; list-style: none; font-size: 16px; }
.steps li { padding: 6px 12px; border-radius: 999px; background: #eef4ff; }
.steps b { color: var(--green-d); }
.help { margin: 14px 0 0; text-align: left; font-size: 15px; color: var(--soft); }
.help summary { cursor: pointer; text-align: center; color: var(--blue); }
.help ol { margin: 8px 0 0; padding-left: 22px; }
.help li { margin: 4px 0; }
.more { display: inline-block; margin-top: 14px; color: var(--blue); font-size: 15px; }
</style></head><body><main>
